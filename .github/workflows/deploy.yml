# Publie l'appli sur GitHub Pages à chaque envoi sur la branche main.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Ticket ouvert quand l'appli devient lente sur téléphone lent (20/11/2026)
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Audit du 11/11/2026 : rien ne part en ligne sans types, tests et lint au vert (quelle que soit l'origine du push)
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Tests d'écrans des parcours principaux (audit du 18/11/2026), sur l'appli construite
      # Chrome déjà installé sur la machine de GitHub (Playwright ne sait pas installer le sien sur toutes les versions
      # d'Ubuntu) ; sans navigateur, avertissement sans bloquer la mise en ligne
      - run: |
          npm i --no-save playwright@1.56.1
          CHROMIUM=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
          if [ -z "$CHROMIUM" ]; then echo "::warning::Pas de navigateur : tests d'écrans sautés"; exit 0; fi
          CHROMIUM="$CHROMIUM" npm run test:ecrans
      # Vitesse sur téléphone lent + 4G lente : au-dessus de 5 s, un ticket prévient (sans bloquer la mise en ligne)
      - name: Vitesse sur téléphone lent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHROMIUM=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)
          if [ -z "$CHROMIUM" ]; then echo "::warning::Pas de navigateur : vitesse non mesurée"; exit 0; fi
          set +e
          CHROMIUM="$CHROMIUM" node tests-ecrans/vitesse.mjs | tee vitesse.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::$(cat vitesse.txt)"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Cycle plus lent sur téléphone lent ($(date -u +%d/%m))" \
              --body "$(cat vitesse.txt) — version du commit $GITHUB_SHA. La mise en ligne n'a pas été bloquée." || true
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # Audit complet du moteur (500 saisons, ~2 min), en même temps que la construction : rien ne part en ligne s'il échoue
  # (audit du 18/11/2026 : avant, il n'était lancé qu'à la main)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit
  deploy:
    needs: [build, audit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
