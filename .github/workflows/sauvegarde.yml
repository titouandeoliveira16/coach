# Sauvegarde chiffrée de la base, chaque lundi à 3 h 17 (UTC) (audit du 18/11/2026, choix 6 A).
# Le dépôt est public : la sauvegarde n'est JAMAIS écrite en clair. Elle est chiffrée (AES-256, clé tirée d'une phrase
# secrète) puis gardée 90 jours comme « artifact » de l'action, lisible seulement avec la phrase secrète.
# Il faut une seule fois, dans GitHub → Settings → Secrets and variables → Actions, un secret SAUVEGARDE_CLE (une longue
# phrase secrète, gardée aussi dans ton gestionnaire de mots de passe : sans elle, la sauvegarde est illisible).
# Sans ce secret, rien n'est sauvegardé (avertissement, sans rien casser). Restauration : supabase/README.md.
name: Sauvegarde

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauvegarder:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SAUVEGARDE_CLE: ${{ secrets.SAUVEGARDE_CLE }}
      PROJET: vjjuopkiwfyqjolxmnho
    steps:
      - name: Exporter puis chiffrer
        id: export
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SAUVEGARDE_CLE" ]; then
            echo "::warning::Secret SAUVEGARDE_CLE (ou SUPABASE_ACCESS_TOKEN) absent : pas de sauvegarde."
            echo "ok=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dossier="$RUNNER_TEMP/sauvegarde"
          mkdir -p "$dossier"
          for t in donnees intervals_cles igpsport_comptes igpsport_faits push_abonnements push_config coachs codes_invitation erreurs; do
            corps=$(jq -n --arg q "select coalesce(json_agg(t), '[]'::json) as lignes from public.$t t" '{query: $q}')
            code=$(curl -sS -o "$dossier/$t.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' \
              "https://api.supabase.com/v1/projects/$PROJET/database/query" -d "$corps")
            # Table absente (ou pas encore créée) : on la saute sans arrêter la sauvegarde
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then echo "::warning::$t : erreur $code, sautée"; rm -f "$dossier/$t.json"; fi
          done
          [ -s "$dossier/donnees.json" ] || { echo "::error::Export de la table donnees impossible"; exit 1; }
          nom="sauvegarde-$(date -u +%Y-%m-%d)"
          tar -czf "$RUNNER_TEMP/$nom.tar.gz" -C "$dossier" .
          rm -rf "$dossier"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -md sha256 \
            -in "$RUNNER_TEMP/$nom.tar.gz" -out "$RUNNER_TEMP/$nom.tar.gz.enc" -pass env:SAUVEGARDE_CLE
          rm -f "$RUNNER_TEMP/$nom.tar.gz"
          echo "nom=$nom" >> "$GITHUB_OUTPUT"
          echo "ok=oui" >> "$GITHUB_OUTPUT"
      - if: steps.export.outputs.ok == 'oui'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.export.outputs.nom }}
          path: ${{ runner.temp }}/${{ steps.export.outputs.nom }}.tar.gz.enc
          retention-days: 90
          if-no-files-found: error
